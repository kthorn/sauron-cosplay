<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4"><rect x="0" y="0" width="100%" height="100%" fill="white" /><title>SAURON | 04 PAIRED SPIRES &amp; SUPPORT</title><desc>Original provisional Sauron paper-fit drawing, nominal 540 mm headband. Not fitted; not foam-ready.</desc><text x="10" y="13" fill="#333333" font-family="DejaVu Sans" font-size="4.2" font-weight="bold">SAURON | 04 PAIRED SPIRES &amp; SUPPORT</text><text x="10" y="20" fill="#666666" font-family="DejaVu Sans" font-size="2.7">PAPER FIT ONLY | nominal band 540 mm | not a fitted foam pattern</text><text x="10" y="26" fill="#666666" font-family="DejaVu Sans" font-size="2.5">S3: tall side pair | S4: shorter forward pair | H: paper strips.</text><text x="10" y="258" fill="#666666" font-family="DejaVu Sans" font-size="2.35">BLACK solid: cut | BLUE dashed: place/bond | GREEN dash-dot: form, do not cut</text><path d="M 20 264 L 120 264" fill="none" stroke="#cc0000" stroke-width="0.32" stroke-linejoin="round" id="calibration" /><path d="M 20 262 L 20 266 L 20 264" fill="none" stroke="#cc0000" stroke-width="0.32" stroke-linejoin="round" /><path d="M 120 262 L 120 266 L 120 264" fill="none" stroke="#cc0000" stroke-width="0.32" stroke-linejoin="round" /><text x="20" y="269" fill="#666666" font-family="DejaVu Sans" font-size="2.6">100 mm at 100% | Actual Size; NO Fit/Shrink</text><text x="178" y="269" fill="#666666" font-family="DejaVu Sans" font-size="2.6">Sheet 4/5</text><g id="piece-S3" transform="translate(15 46)" data-piece="S3" data-quantity="2" data-thickness="4 mm" data-mirror="true"><path d="M 22 0 L 28 0 L 29 3 L 34 34 L 39 77 L 40 111 L 43 147 L 50 180 L 50 205 L 0 205 L 0 180 L 11 147 L 12 111 L 16 77 L 19 34 L 21 3 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-S3" /><path d="M 25 8 L 25 180" fill="none" stroke="#228833" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="3 1 0.7 1" /><path d="M 0 180 L 50 180" fill="none" stroke="#0066cc" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="2 2" /><text x="3" y="191" fill="#666666" font-family="DejaVu Sans" font-size="2.1">25 mm root</text><text x="3" y="198" fill="#666666" font-family="DejaVu Sans" font-size="2.1">included</text></g><text x="15" y="41" fill="#666666" font-family="DejaVu Sans" font-size="2.5" font-weight="bold">S3 x2 MIRROR | 4 mm</text><g id="piece-S4" transform="translate(78 46)" data-piece="S4" data-quantity="2" data-thickness="4 mm" data-mirror="true"><path d="M 19 0 L 25 0 L 26 3 L 30 34 L 32 74 L 34 108 L 44 130 L 44 155 L 0 155 L 0 130 L 10 108 L 12 74 L 14 34 L 18 3 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-S4" /><path d="M 22 8 L 22 130" fill="none" stroke="#228833" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="3 1 0.7 1" /><path d="M 0 130 L 44 130" fill="none" stroke="#0066cc" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="2 2" /><text x="3" y="141" fill="#666666" font-family="DejaVu Sans" font-size="2.1">25 mm root</text><text x="3" y="148" fill="#666666" font-family="DejaVu Sans" font-size="2.1">included</text></g><text x="78" y="41" fill="#666666" font-family="DejaVu Sans" font-size="2.5" font-weight="bold">S4 x2 MIRROR | 4 mm</text><g id="piece-H" transform="translate(144 46)" data-piece="H" data-quantity="6" data-thickness="PAPER" data-mirror="false"><path d="M 0 0 L 25 0 L 25 165 L 0 165 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-H" /><path d="M 0 20 L 25 20" fill="none" stroke="#0066cc" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="2 2" /><path d="M 0 105 L 25 105" fill="none" stroke="#0066cc" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="2 2" /><path d="M 0 145 L 25 145" fill="none" stroke="#0066cc" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="2 2" /><text x="2" y="15" fill="#666666" font-family="DejaVu Sans" font-size="2.1">20 join</text><text x="2" y="101" fill="#666666" font-family="DejaVu Sans" font-size="2.1">60 rear</text><text x="2" y="158" fill="#666666" font-family="DejaVu Sans" font-size="2.1">20 join</text></g><text x="144" y="41" fill="#666666" font-family="DejaVu Sans" font-size="2.5" font-weight="bold">H x6 | PAPER</text><text x="174" y="61" fill="#666666" font-family="DejaVu Sans" font-size="2.4">PAPER</text><text x="174" y="67" fill="#666666" font-family="DejaVu Sans" font-size="2.4">165 x 25</text><text x="174" y="73" fill="#666666" font-family="DejaVu Sans" font-size="2.4">strip</text><text x="79" y="216" fill="#666666" font-family="DejaVu Sans" font-size="2.5">H x4: 3 joints at 20 mm = 600 mm.</text><text x="79" y="223" fill="#666666" font-family="DejaVu Sans" font-size="2.5">Rear overlap 60 mm = 540 mm loop.</text><text x="79" y="230" fill="#666666" font-family="DejaVu Sans" font-size="2.5">H x2: 20 mm join = 310 mm strap.</text><text x="79" y="237" fill="#666666" font-family="DejaVu Sans" font-size="2.5">20 mm ends leave 270 mm over head.</text><text x="79" y="246" fill="#666666" font-family="DejaVu Sans" font-size="2.5">All support lengths remain adjustable.</text></svg>