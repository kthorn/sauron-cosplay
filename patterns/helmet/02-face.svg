<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4"><rect x="0" y="0" width="100%" height="100%" fill="white" /><title>SAURON | 02 SPLIT FACE &amp; CHEEKS</title><desc>Original provisional Sauron paper-fit drawing, nominal 540 mm headband. Not fitted; not foam-ready.</desc><text x="10" y="13" fill="#333333" font-family="DejaVu Sans" font-size="4.2" font-weight="bold">SAURON | 02 SPLIT FACE &amp; CHEEKS</text><text x="10" y="20" fill="#666666" font-family="DejaVu Sans" font-size="2.7">PAPER FIT ONLY | nominal band 540 mm | not a fitted foam pattern</text><text x="10" y="26" fill="#666666" font-family="DejaVu Sans" font-size="2.5">C and C2: cut one left + one right by flipping the template.</text><text x="10" y="258" fill="#666666" font-family="DejaVu Sans" font-size="2.35">BLACK solid: cut | BLUE dashed: place/bond | GREEN dash-dot: form, do not cut</text><path d="M 20 264 L 120 264" fill="none" stroke="#cc0000" stroke-width="0.32" stroke-linejoin="round" id="calibration" /><path d="M 20 262 L 20 266 L 20 264" fill="none" stroke="#cc0000" stroke-width="0.32" stroke-linejoin="round" /><path d="M 120 262 L 120 266 L 120 264" fill="none" stroke="#cc0000" stroke-width="0.32" stroke-linejoin="round" /><text x="20" y="269" fill="#666666" font-family="DejaVu Sans" font-size="2.6">100 mm at 100% | Actual Size; NO Fit/Shrink</text><text x="178" y="269" fill="#666666" font-family="DejaVu Sans" font-size="2.6">Sheet 2/5</text><g id="piece-B" transform="translate(15 42)" data-piece="B" data-quantity="1" data-thickness="4 mm" data-mirror="false"><path d="M 18 0 L 24 0 L 34 13 L 42 25 L 31 38 L 26 45 L 26 80 L 30 112 L 38 164 L 35 196 L 26 210 L 24 208 L 21 176 L 18 208 L 16 210 L 7 196 L 4 164 L 12 112 L 16 80 L 16 45 L 11 38 L 0 25 L 8 13 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-B" /><path d="M 17 90 L 25 90 L 27 112 L 28 148 L 25 160 L 23 165 L 19 165 L 17 160 L 14 148 L 15 112 Z" fill="no