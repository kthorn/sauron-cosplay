<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4"><rect x="0" y="0" width="100%" height="100%" fill="white" /><title>SAURON | 03 TEMPLES &amp; CENTER SPIRES</title><desc>Original provisional Sauron paper-fit drawing, nominal 540 mm headband. Not fitted; not foam-ready.</desc><text x="10" y="13" fill="#333333" font-family="DejaVu Sans" font-size="4.2" font-weight="bold">SAURON | 03 TEMPLES &amp; CENTER SPIRES</text><text x="10" y="20" fill="#666666" font-family="DejaVu Sans" font-size="2.7">PAPER FIT ONLY | nominal band 540 mm | not a fitted foam pattern</text><text x="10" y="26" fill="#666666" font-family="DejaVu Sans" font-size="2.5">S1: front center | S2: rear center | D: mirrored side plates.</text><text x="10" y="258" fill="#666666" font-family="DejaVu Sans" font-size="2.35">BLACK solid: cut | BLUE dashed: place/bond | GREEN dash-dot: form, do not cut</text><path d="M 20 264 L 120 264" fill="none" stroke="#cc0000" stroke-width="0.32" stroke-linejoin="round" id="calibration" /><path d="M 20 262 L 20 266 L 20 264" fill="none" stroke="#cc0000" stroke-width="0.32" stroke-linejoin="round" /><path d="M 120 262 L 120 266 L 120 264" fill="none" stroke="#cc0000" stroke-width="0.32" stroke-linejoin="round" /><text x="20" y="269" fill="#666666" font-family="DejaVu Sans" font-size="2.6">100 mm at 100% | Actual Size; NO Fit/Shrink</text><text x="178" y="269" fill="#666666" font-family="DejaVu Sans" font-size="2.6">Sheet 3/5</text><g id="piece-D" transform="translate(12 46)" data-piece="D" data-quantity="2" data-thickness="4 mm" data-mirror="true"><path d="M 38 0 L 62 8 L 80 23 L 74 48 L 73 86 L 79 113 L 72 132 L 50 145 L 47 144 L 42 135 L 19 125 L 10 128 L 6 127 L 12 111 L 0 95 L 6 80 L 5 48 L 17 27 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-D" /><path d="M 35 13.2 L 36.8 15 L 35 16.8 L 33.2 15 Z" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><text x="38" y="13" fill="#666666" font-family="DejaVu Sans" font-size="2.1">A/D</text></g><text x="12" y="41" fill="#666666" font-family="DejaVu Sans" font-size="2.5" font-weight="bold">D x2 MIRROR | 4 mm</text><g id="piece-S1" transform="translate(103 46)" data-piece="S1" data-quantity="1" data-thickness="4 mm" data-mirror="false"><path d="M 18 0 L 24 0 L 25 3 L 29 40 L 32 80 L 35 125 L 42 160 L 42 185 L 0 185 L 0 160 L 7 125 L 10 80 L 13 40 L 17 3 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-S1" /><path d="M 21 8 L 21 160" fill="none" stroke="#228833" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="3 1 0.7 1" /><path d="M 0 160 L 42 160" fill="none" stroke="#0066cc" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="2 2" /><text x="3" y="171" fill="#666666" font-family="DejaVu Sans" font-size="2.1">25 mm root</text><text x="3" y="178" fill="#666666" font-family="DejaVu Sans" font-size="2.1">included</text></g><text x="103" y="41" fill="#666666" font-family="DejaVu Sans" font-size="2.5" font-weight="bold">S1 x1 | 4 mm</text><g id="piece-S2" transform="translate(154 46)" data-piece="S2" data-quantity="1" data-thickness="4 mm" data-mirror="false"><path d="M 18 0 L 24 0 L 25 3 L 28 35 L 30 75 L 32 110 L 42 150 L 42 175 L 0 175 L 0 150 L 10 110 L 12 75 L 14 35 L 17 3 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-S2" /><path d="M 21 8 L 21 150" fill="none" stroke="#228833" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="3 1 0.7 1" /><path d="M 0 150 L 42 150" fill="none" stroke="#0066cc" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="2 2" /><text x="3" y="161" fill="#666666" font-family="DejaVu Sans" font-size="2.1">25 mm root</text><text x="3" y="168" fill="#666666" font-family="DejaVu Sans" font-size="2.1">included</text></g><text x="154" y="41" fill="#666666" font-family="DejaVu Sans" font-size="2.5" font-weight="bold">S2 x1 | 4 mm</text><text x="15" y="218" fill="#666666" font-family="DejaVu Sans" font-size="2.5">Spire roots are INCLUDED.</text><text x="15" y="224" fill="#666666" font-family="DejaVu Sans" font-size="2.5">Form shallow open V ridges.</text><text x="15" y="230" fill="#666666" font-family="DejaVu Sans" font-size="2.5">Never add rigid cores.</text><text x="15" y="245" fill="#666666" font-family="DejaVu Sans" font-size="2.5">S2 rear root must not bridge the reachable rear band overlap.</text></svg>