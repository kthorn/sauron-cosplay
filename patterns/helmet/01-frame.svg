<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4"><rect x="0" y="0" width="100%" height="100%" fill="white" /><title>SAURON | 01 FRAME &amp; DETAILS</title><desc>Original provisional Sauron paper-fit drawing, nominal 540 mm headband. Not fitted; not foam-ready.</desc><text x="10" y="13" fill="#333333" font-family="DejaVu Sans" font-size="4.2" font-weight="bold">SAURON | 01 FRAME &amp; DETAILS</text><text x="10" y="20" fill="#666666" font-family="DejaVu Sans" font-size="2.7">PAPER FIT ONLY | nominal band 540 mm | not a fitted foam pattern</text><text x="10" y="26" fill="#666666" font-family="DejaVu Sans" font-size="2.5">Cut one master per shape; trace mirrored pairs onto spare paper.</text><text x="10" y="258" fill="#666666" font-family="DejaVu Sans" font-size="2.35">BLACK solid: cut | BLUE dashed: place/bond | GREEN dash-dot: form, do not cut</text><path d="M 20 264 L 120 264" fill="none" stroke="#cc0000" stroke-width="0.32" stroke-linejoin="round" id="calibration" /><path d="M 20 262 L 20 266 L 20 264" fill="none" stroke="#cc0000" stroke-width="0.32" stroke-linejoin="round" /><path d="M 120 262 L 120 266 L 120 264" fill="none" stroke="#cc0000" stroke-width="0.32" stroke-linejoin="round" /><text x="20" y="269" fill="#666666" font-family="DejaVu Sans" font-size="2.6">100 mm at 100% | Actual Size; NO Fit/Shrink</text><text x="178" y="269" fill="#666666" font-family="DejaVu Sans" font-size="2.6">Sheet 1/5</text><g id="piece-A" transform="translate(20 46)" data-piece="A" data-quantity="1" data-thickness="4 mm" data-mirror="false"><path d="M 85 0 L 110 14 L 135 19 L 160 12 L 166 35 L 170 51 L 163 75 L 150 83 L 141 96 L 135 98 L 112 88 L 99 83 L 85 91 L 71 83 L 58 88 L 35 98 L 29 96 L 20 83 L 7 75 L 0 51 L 4 35 L 10 12 L 35 19 L 60 14 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-A" /><path d="M 34 50 L 41 48 L 60 53 L 78 60 L 74 70 L 57 77 L 39 70 L 32 60 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-A-eye-left" /><path d="M 136 50 L 129 48 L 110 53 L 92 60 L 96 70 L 113 77 L 131 70 L 138 60 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-A-eye-right" /><path d="M 60 18 L 110 18 L 110 43 L 60 43 Z" fill="none" stroke="#0066cc" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="2 2" /><text x="64" y="40" fill="#666666" font-family="DejaVu Sans" font-size="2.1">K face half centered behind</text><path d="M 4 35 L 24 35 L 24 60 L 4 60 Z" fill="none" stroke="#0066cc" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="2 2" /><text x="5" y="59" fill="#666666" font-family="DejaVu Sans" font-size="2.1">L behind</text><path d="M 146 35 L 166 35 L 166 60 L 146 60 Z" fill="none" stroke="#0066cc" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="2 2" /><text x="147" y="59" fill="#666666" font-family="DejaVu Sans" font-size="2.1">L behind</text><path d="M 53 62 L 57 62" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><path d="M 55 60 L 55 64" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><path d="M 113 62 L 117 62" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><path d="M 115 60 L 115 64" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><path d="M 85 23.2 L 86.8 25 L 85 26.8 L 83.2 25 Z" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><text x="88" y="21" fill="#666666" font-family="DejaVu Sans" font-size="2.1">A/B</text><path d="M 25 84.2 L 26.8 86 L 25 87.8 L 23.2 86 Z" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><text x="26" y="83" fill="#666666" font-family="DejaVu Sans" font-size="2.1">A/C</text><path d="M 145 84.2 L 146.8 86 L 145 87.8 L 143.2 86 Z" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><text x="136" y="83" fill="#666666" font-family="DejaVu Sans" font-size="2.1">A/C</text><path d="M 10 43.2 L 11.8 45 L 10 46.8 L 8.2 45 Z" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><text x="4" y="43" fill="#666666" font-family="DejaVu Sans" font-size="2.1">A/D</text><path d="M 160 43.2 L 161.8 45 L 160 46.8 L 158.2 45 Z" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><text x="163" y="43" fill="#666666" font-family="DejaVu Sans" font-size="2.1">A/D</text><path d="M 38 25.2 L 39.8 27 L 38 28.8 L 36.2 27 Z" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><text x="41" y="25" fill="#666666" font-family="DejaVu Sans" font-size="2.1">A/E</text><path d="M 132 25.2 L 133.8 27 L 132 28.8 L 130.2 27 Z" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><text x="123" y="25" fill="#666666" font-family="DejaVu Sans" font-size="2.1">A/E</text></g><text x="20" y="41" fill="#666666" font-family="DejaVu Sans" font-size="2.5" font-weight="bold">A x1 | 4 mm</text><text x="25" y="151" fill="#666666" font-family="DejaVu Sans" font-size="2.5">A: cut both eye openings. Nominal eye-center spacing 60 mm; adjust on wearer.</text><g id="piece-E" transform="translate(20 167)" data-piece="E" data-quantity="2" data-thickness="2 mm" data-mirror="true"><path d="M 0 16 L 15 11 L 28 0 L 45 12 L 64 20 L 60 27 L 42 22 L 27 9 L 18 18 L 5 24 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-E" /><path d="M 20 8.2 L 21.8 10 L 20 11.8 L 18.2 10 Z" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><text x="20" y="20" fill="#666666" font-family="DejaVu Sans" font-size="2.1">A/E</text></g><text x="20" y="162" fill="#666666" font-family="DejaVu Sans" font-size="2.5" font-weight="bold">E x2 MIRROR | 2 mm</text><g id="piece-K" transform="translate(108 167)" data-piece="K" data-quantity="1" data-thickness="4-6 mm" data-mirror="false"><path d="M 0 0 L 50 0 L 50 25 L 0 25 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-K" /><path d="M 25 0 L 25 25" fill="none" stroke="#228833" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="3 1 0.7 1" /><text x="3" y="10" fill="#666666" font-family="DejaVu Sans" font-size="2.3">FACE</text><text x="3" y="17" fill="#666666" font-family="DejaVu Sans" font-size="2.1">behind A</text><text x="28" y="10" fill="#666666" font-family="DejaVu Sans" font-size="2.3">BAND</text><text x="28" y="17" fill="#666666" font-family="DejaVu Sans" font-size="2.3">half</text></g><text x="108" y="162" fill="#666666" font-family="DejaVu Sans" font-size="2.5" font-weight="bold">K x1 | 4-6 mm</text><g id="piece-L" transform="translate(172 167)" data-piece="L" data-quantity="2" data-thickness="4-6 mm" data-mirror="false"><path d="M 0 0 L 25 0 L 25 40 L 0 40 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-L" /><path d="M 0 20 L 25 20" fill="none" stroke="#228833" stroke-width="0.32" stroke-linejoin="round" stroke-dasharray="3 1 0.7 1" /><text x="3" y="10" fill="#666666" font-family="DejaVu Sans" font-size="2.1">TEMPLE</text><text x="3" y="29" fill="#666666" font-family="DejaVu Sans" font-size="2.3">tab</text></g><text x="172" y="162" fill="#666666" font-family="DejaVu Sans" font-size="2.5" font-weight="bold">L x2 | 4-6 mm</text><g id="piece-G" transform="translate(108 202)" data-piece="G" data-quantity="1" data-thickness="2 mm" data-mirror="false"><path d="M 18 0 L 22 0 L 36 9 L 40 22 L 26 35 L 23 47 L 17 47 L 14 35 L 0 22 L 4 9 Z" fill="none" stroke="#000000" stroke-width="0.32" stroke-linejoin="round" id="cut-G" /><path d="M 20 8.2 L 21.8 10 L 20 11.8 L 18.2 10 Z" fill="none" stroke="#666666" stroke-width="0.2" stroke-linejoin="round" /><text x="15" y="20" fill="#666666" font-family="DejaVu Sans" font-size="2.1">B/G</text></g><text x="108" y="197" fill="#666666" font-family="DejaVu Sans" font-size="2.5" font-weight="bold">G x1 | 2 mm</text><text x="20" y="211" fill="#666666" font-family="DejaVu Sans" font-size="2.6">E/G: optional overlays.</text><text x="20" y="218" fill="#666666" font-family="DejaVu Sans" font-size="2.6">K/L: fold to set face stand-off.</text><text x="20" y="225" fill="#666666" font-family="DejaVu Sans" font-size="2.6">Diamonds: match same label.</text><text x="20" y="232" fill="#666666" font-family="DejaVu Sans" font-size="2.6">Fit the unadorned mask first.</text><text x="20" y="239" fill="#666666" font-family="DejaVu Sans" font-size="2.4">L: turn 90 degrees to fit blue boxes.</text><text x="20" y="244" fill="#666666" font-family="DejaVu Sans" font-size="2.6">Suggested foam thicknesses apply only after paper fitting.</text></svg>