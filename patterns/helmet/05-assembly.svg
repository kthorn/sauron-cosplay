t-family="DejaVu Sans" font-size="2.4" text-anchor="middle">S3 R</text><circle cx="139" cy="117" r="1.5" fill="#777777" /><text x="139" y="113" fill="#666666" font-family="DejaVu Sans" font-size="2.4" text-anchor="middle">S4 L</text><circle cx="184" cy="117" r="1.5" fill="#777777" /><text x="184" y="113" fill="#666666" font-family="DejaVu Sans" font-size="2.4" text-anchor="middle">S4 R</text><circle cx="164" cy="134" r="1.5" fill="#777777" /><text x="164" y="130" fill="#666666" font-family="DejaVu Sans" font-size="2.4" text-anchor="middle">S1 FRONT</text><text x="130" y="148" fill="#666666" font-family="DejaVu Sans" font-size="2.5">Three connections to support:</text><text x="130" y="155" fill="#666666" font-family="DejaVu Sans" font-size="2.5">K forehead + L at both temples.</text><text x="130" y="162" fill="#666666" font-family="DejaVu Sans" font-size="2.5">Do not hang from temples alone.</text><text x="130" y="175" fill="#666666" font-family="DejaVu Sans" font-size="2.45">Layer order / placement anchors:</text><text x="130" y="182" fill="#666666" font-family="DejaVu Sans" font-size="2.45">A frame + B center: A/B</text><text x="130" y="189" fill="#666666" font-family="DejaVu Sans" font-size="2.45">C cheeks on A: A/C</text><text x="130" y="196" fill="#666666" font-family="DejaVu Sans" font-size="2.45">D temples behind A/C: A/D</text><text x="130" y="203" fill="#666666" font-family="DejaVu Sans" font-size="2.45">E brow ridges on A: A/E</text><text x="130" y="210" fill="#666666" font-family="DejaVu Sans" font-size="2.45">G forehead accent on B: B/G</text><text x="130" y="217" fill="#666666" font-family="DejaVu Sans" font-size="2.45">C2 inset on C: C2.1 / C2.2</text><text x="130" y="224" fill="#666666" font-family="DejaVu Sans" font-size="2.45">L tabs: blue side boxes behind A</text><text x="130" y="231" fill="#666666" font-family="DejaVu Sans" font-size="2.45">Six spires: S1 + S2 + 2S3 + 2S4</text><text x="11" y="245" fill="#666666" font-family="DejaVu Sans" font-size="2.55">Paper test: vision, breathing, pressure, clearance, balance and unaided removal.</text></svg>